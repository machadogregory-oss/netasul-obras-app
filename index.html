<script>
/* =====================================================================
   NETASUL OBRAS v2 - app do montador
   ---------------------------------------------------------------------
   1. Utilidades e configuração
   2. Árvore da obra (frentes → itens) - MESMA regra do painel do PC
   3. Banco local (IndexedDB)
   4. Sincronização com a nuvem (Supabase REST)
   5. Telas: login, obras, obra, registro diário, sincronizar, configurar
   6. Inicialização
   ===================================================================== */

/* ------------------------------ 1. UTILIDADES ------------------------------ */
const VERSAO='2.4';
const SUGESTOES = {
  funcoes:['Montador','Ajudante','Encanador','Eletricista','Operador de máquina','Pedreiro','Servente','Encarregado','Motorista'],
  maquinas:['Retroescavadeira','Trator','Valetadeira','Escavadeira','Pá carregadeira','Caminhão','Compactador','Gerador','Motobomba'],
  ocorrencias:['Chuva','Atraso de material','Pendência do contratante','Pendência Netasul','Falha de equipamento','Acidente','Outro'],
};
const UNIDADES = ['m','un','cx','rolo','kg','L','m³','sc','pç'];

function uuid(){ if (crypto.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16)}); }
function hoje(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dataBR(iso){ if(!iso) return ''; const [a,m,d]=String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+a; }
function num(v){ const n=parseFloat(String(v??'').replace(',','.')); return isNaN(n)?0:n; }
function fmt(n){ return (Math.round(n*100)/100).toLocaleString('pt-BR'); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function aviso(msg,ms=2200){ const a=$('aviso'); a.textContent=msg; a.classList.add('mostrar'); clearTimeout(a._t); a._t=setTimeout(()=>a.classList.remove('mostrar'),ms); }
function $(id){ return document.getElementById(id); }
function datalist(id,lista){ return `<datalist id="${id}">${lista.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`; }
function opcoes(lista,sel){ return lista.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join(''); }
async function sha256(texto){ const b=new TextEncoder().encode(texto); const h=await crypto.subtle.digest('SHA-256',b); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function getCfg(){ try{ return JSON.parse(localStorage.getItem('netasul_cfg')||'{}'); }catch(e){ return {}; } }
function setCfg(c){ localStorage.setItem('netasul_cfg', JSON.stringify(c)); }
function dispositivoId(){ let c=getCfg(); if(!c.dispositivo){ c.dispositivo=uuid().slice(0,8); setCfg(c);} return c.dispositivo; }
function usuarioAtual(){ return getCfg().usuario||null; }

/* ------------------------------ 2. ÁRVORE DA OBRA ------------------------------ */
// A partir das quantidades que o gerente cadastrou (obra.estrutura, obra.setores, obra.casas)
// monta a lista de itens que o montador vai marcar. Itens "qtd" têm previsto (m ou un);
// itens "check" são feito/não feito. ATENÇÃO: o painel do PC tem a MESMA função em Python.
const FRENTES = {adutora:'Adutora', principal:'Principal', setores:'Setores / ramais', valetas:'Valetas', casas:'Casa de irrigação', balsa:'Balsa', automacao:'Automação', eletrica:'Elétrica', finalizacao:'Finalização'};
function montarItens(obra){
  const e=obra.estrutura||{}, it=[];
  const qtd=(id,frente,nome,un,prev,grupo='')=>{ if(num(prev)>0) it.push({id,frente,grupo,nome,tipo:'qtd',unidade:un,previsto:num(prev)}); };
  const chk=(id,frente,nome,cond=true,grupo='')=>{ if(cond) it.push({id,frente,grupo,nome,tipo:'check',unidade:'',previsto:1}); };
  const a=e.adutora||{};
  qtd('adutora.metros','adutora','Adutora montada','m',a.metros);
  qtd('adutora.curvas','adutora','Curvas montadas','un',a.curvas);
  qtd('adutora.valvulas_ar','adutora','Válvulas de ar instaladas','un',a.valvulas_ar);
  qtd('adutora.ancoragens','adutora','Ancoragem de curvas e válvulas de ar','un',a.ancoragens);
  chk('adutora.automacao','adutora','Automação da adutora',!!a.automacao);
  chk('adutora.entrada_tanque','adutora','Entrada da adutora no tanque',!!a.tanque);
  chk('adutora.saida_tanque','adutora','Saída da adutora do tanque',!!a.tanque);
  const p=e.principal||{};
  qtd('principal.metros','principal','Principal montada','m',p.metros);
  qtd('principal.saidas','principal','Saídas de cavalete / tês','un',p.saidas);
  qtd('principal.valvulas_cavalete','principal','Válvulas de cavalete montadas','un',p.valvulas_cavalete);
  qtd('principal.ancoragens','principal','Ancoragem das saídas','un',p.ancoragens);
  qtd('principal.caixas','principal','Caixas de cavalete prontas','un',p.caixas);
  chk('principal.derivacao','principal','Derivação da adutora',!!p.derivacao);
  chk('principal.pique','principal','Entrada / saída de pique',!!p.pique);
  chk('principal.microtubo','principal','Microtubo de automação dos cavaletes',!!p.microtubo);
  chk('principal.automacao','principal','Automação do principal',!!p.automacao);
  let ramais=0;
  for (const s of (obra.setores||[])) {
    const g=s.nome||'Setor'; const b='setor.'+s.id+'.'; ramais+=num(s.metros_ramal);
    qtd(b+'ramais','setores','Ramais montados','m',s.metros_ramal,g);
    qtd(b+'valvulas','setores','Válvulas do setor montadas','un',s.valvulas,g);
    for (const [k,n] of [['soldagem','Soldagem dos tubos'],['precobertura','Pré-cobertura'],['antivacuo','Válvulas antivácuo'],['chicoteado','Chicoteado'],['finais','Finais de ramal'],['lavagem','Lavagem do setor'],['pressurizacao','Pressurização do setor'],['checklist','Checklist do setor']]) chk(b+k,'setores',n,true,g);
  }
  const v=e.valetas||{}; const prevVal = num(v.metros)>0 ? num(v.metros) : num(a.metros)+num(p.metros)+ramais;
  qtd('valetas.metros','valetas','Valetas abertas (máquina)','m',prevVal);
  for (const c of (obra.casas||[])) {
    const g=c.nome||'Casa'; const b='casa.'+c.id+'.';
    for (const [k,n] of [['pronta','Casa pronta (civil)'],['bomba','Montagem da bomba'],['filtro','Montagem do filtro'],['hidrometro','Hidrômetro entrada/saída da ferti'],['valvula_hidraulica','Válvula hidráulica da bomba'],['pique','Entrada de pique'],['ferti','Montagem da fertirrigação']]) chk(b+k,'casas',n,true,g);
  }
  const bl=e.balsa||{};
  if (bl.tem) { chk('balsa.montagem','balsa','Montagem da balsa'); if(num(bl.solda_pead_m)>0) qtd('balsa.solda_pead','balsa','Solda do PEAD','m',bl.solda_pead_m); else chk('balsa.solda_pead','balsa','Solda do PEAD'); }
  chk('automacao.regua','automacao','Régua de solenoides');
  chk('automacao.controlador','automacao','Instalação do controlador');
  const el=e.eletrica||{}; const tp={direta:'partida direta',soft:'soft-starter',inversor:'inversor'}[el.tipo_partida]||'quadro de partida';
  chk('eletrica.montagem','eletrica','Montagem elétrica do sistema');
  chk('eletrica.fluxostato','eletrica','Fluxostato instalado e testado');
  chk('eletrica.pressostato','eletrica','Pressostato instalado e testado');
  chk('eletrica.parametrizacao','eletrica','Parametrização do '+tp+' e proteções');
  chk('finalizacao.lavagem','finalizacao','Lavagem geral do sistema');
  chk('finalizacao.pressurizacao','finalizacao','Pressurização do sistema');
  chk('finalizacao.checklist','finalizacao','Checklist geral (setor por setor)');
  chk('finalizacao.entrega','finalizacao','Entrega técnica');
  return it;
}
// Calcula executado e % de cada item, de cada frente e da obra
function calcularProgresso(obra, registros){
  const itens=montarItens(obra); const exec={}, quando={};
  for (const r of registros) for (const a of (r.avancos||[])) { exec[a.item_id]=(exec[a.item_id]||0)+num(a.quantidade); if(!quando[a.item_id]||r.data<quando[a.item_id]) quando[a.item_id]=r.data; }
  for (const i of itens) { i.executado=exec[i.id]||0; i.pct=i.previsto>0?Math.min(100,i.executado/i.previsto*100):0; i.feito=i.tipo==='check'&&i.executado>=1; i.quando=quando[i.id]; }
  const frentes=[];
  for (const f of Object.keys(FRENTES)) { const its=itens.filter(i=>i.frente===f); if(!its.length) continue; frentes.push({id:f,nome:FRENTES[f],itens:its,pct:its.reduce((s,i)=>s+i.pct,0)/its.length}); }
  const pct = frentes.length? frentes.reduce((s,f)=>s+f.pct,0)/frentes.length : 0;
  return {itens,frentes,pct};
}

/* ------------------------------ 3. BANCO LOCAL ------------------------------ */
const DB = {
  db:null,
  abrir(){ return new Promise((res,rej)=>{
    const r = indexedDB.open('netasul_obras', 2);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      for (const n of ['obras','registros','fotos','usuarios']) {
        if (d.objectStoreNames.contains(n)) continue;
        const s = d.createObjectStore(n,{keyPath:'id'});
        s.createIndex('sync','sync');
        if (n==='registros'||n==='fotos') s.createIndex('obra_id','obra_id');
        if (n==='fotos') s.createIndex('registro_id','registro_id');
      }
    };
    r.onsuccess = e => { DB.db = e.target.result; res(); };
    r.onerror = e => rej(e.target.error);
  });},
  req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  st(n,modo='readonly'){ return this.db.transaction(n,modo).objectStore(n); },
  salvar(n,obj){ return this.req(this.st(n,'readwrite').put(obj)); },
  pegar(n,id){ return this.req(this.st(n).get(id)); },
  todos(n){ return this.req(this.st(n).getAll()); },
  porIndice(n,idx,val){ return this.req(this.st(n).index(idx).getAll(val)); },
  apagar(n,id){ return this.req(this.st(n,'readwrite').delete(id)); },
};
async function contarPendentes(){
  let t=0; for (const n of ['registros','fotos','obras']) t += (await DB.todos(n)).filter(x=>x.sync!=='ok').length;
  const b=$('bolha-sync'); b.textContent=t; b.style.display = t?'flex':'none'; return t;
}

/* ------------------------------ 4. SINCRONIZAÇÃO ------------------------------ */
function cfgOk(){ const c=getCfg(); return !!(c.url && c.key); }
async function api(metodo, caminho, corpo, extra={}){
  const c=getCfg();
  const r = await fetch(c.url.replace(/\/+$/,'')+caminho, { method:metodo, headers:{ apikey:c.key, Authorization:'Bearer '+c.key, 'Content-Type':'application/json', ...extra }, body: corpo!==undefined ? JSON.stringify(corpo) : undefined });
  if(!r.ok) throw new Error(metodo+' '+caminho+' → HTTP '+r.status+' '+(await r.text()).slice(0,200));
  const t=await r.text(); return t? JSON.parse(t):null;
}
async function uploadFoto(caminho, blob){
  const c=getCfg();
  const r = await fetch(c.url.replace(/\/+$/,'')+'/storage/v1/object/fotos-obras/'+caminho, { method:'POST', headers:{ apikey:c.key, Authorization:'Bearer '+c.key, 'Content-Type':'image/jpeg', 'x-upsert':'true' }, body:blob });
  if(!r.ok) throw new Error('upload foto → HTTP '+r.status+' '+(await r.text()).slice(0,200));
}
function urlFoto(caminho){ return getCfg().url.replace(/\/+$/,'')+'/storage/v1/object/public/fotos-obras/'+caminho; }
function limpar(o){ const c={...o}; delete c.sync; delete c.blob; delete c.erro; return c; }

async function baixarUsuarios(){
  const us=await api('GET','/rest/v1/usuarios?select=*&ativo=eq.true&order=nome');
  for (const u of us) await DB.salvar('usuarios',{...u,sync:'ok'});
  const ids=new Set(us.map(u=>u.id)); for (const u of await DB.todos('usuarios')) if(!ids.has(u.id)) await DB.apagar('usuarios',u.id);
  return us.length;
}

let sincronizando=false;
async function sincronizar(silencioso=false){
  if (sincronizando) return;
  if (!cfgOk()) { if(!silencioso) aviso('Configure o servidor primeiro (aba Configurar).'); return; }
  if (!navigator.onLine) { if(!silencioso) aviso('Sem internet agora. Os dados ficam guardados no celular.'); return; }
  sincronizando=true;
  const log=(m)=>{ const el=$('log-sync'); if(el){ el.textContent+=m+'\n'; el.scrollTop=el.scrollHeight; } };
  let erros=0;
  try{
    log('Iniciando sincronização '+new Date().toLocaleTimeString('pt-BR'));
    for (const o of (await DB.todos('obras')).filter(x=>x.sync==='pendente')) {
      try{ await api('PATCH','/rest/v1/obras?id=eq.'+o.id,{checklist_inicio:o.checklist_inicio||{}}); o.sync='ok'; await DB.salvar('obras',o); log('✓ checklist da obra '+o.nome); }
      catch(e){ erros++; log('✗ checklist '+o.nome+': '+e.message); }
    }
    for (const r of (await DB.todos('registros')).filter(x=>x.sync!=='ok')) {
      try{
        if (r.sync==='apagar') { await api('DELETE','/rest/v1/registros?id=eq.'+r.id); await DB.apagar('registros',r.id); log('✓ registro apagado '+dataBR(r.data)); continue; }
        await api('POST','/rest/v1/registros',[limpar(r)],{Prefer:'resolution=merge-duplicates'}); r.sync='ok'; delete r.erro; await DB.salvar('registros',r); log('✓ registro '+dataBR(r.data));
      }catch(e){ erros++; r.erro=e.message; await DB.salvar('registros',r); log('✗ registro '+dataBR(r.data)+': '+e.message); }
    }
    for (const f of (await DB.todos('fotos')).filter(x=>x.sync!=='ok')) {
      try{
        if (f.sync==='apagar') { await api('DELETE','/rest/v1/fotos?id=eq.'+f.id); await DB.apagar('fotos',f.id); continue; }
        const reg=await DB.pegar('registros',f.registro_id); if(!reg||reg.sync!=='ok') continue;
        if (f.blob) await uploadFoto(f.caminho,f.blob);
        await api('POST','/rest/v1/fotos',[limpar(f)],{Prefer:'resolution=merge-duplicates'});
        f.sync='ok'; delete f.erro; await DB.salvar('fotos',f); log('✓ foto '+(f.legenda||''));
      }catch(e){ erros++; f.erro=e.message; await DB.salvar('fotos',f); log('✗ foto: '+e.message); }
    }
    // baixar: usuários, obras, registros e fotos (o que o gerente cadastrou e o que outros montadores lançaram)
    const nUs=await baixarUsuarios();
    const obrasNuvem=await api('GET','/rest/v1/obras?select=*&order=nome');
    for (const o of obrasNuvem) { const loc=await DB.pegar('obras',o.id); if(!loc || loc.sync==='ok') await DB.salvar('obras',{...o,sync:'ok'}); }
    const idsObras=new Set(obrasNuvem.map(o=>o.id)); for (const o of await DB.todos('obras')) if(!idsObras.has(o.id)) await DB.apagar('obras',o.id);
    const regsNuvem=await api('GET','/rest/v1/registros?select=*&order=data.desc&limit=3000');
    for (const r of regsNuvem) { const loc=await DB.pegar('registros',r.id); if(!loc||loc.sync==='ok') await DB.salvar('registros',{...r,sync:'ok'}); }
    const fotosNuvem=await api('GET','/rest/v1/fotos?select=id,registro_id,obra_id,caminho,legenda,item_id,lat,lng,tirada_em&order=tirada_em.desc&limit=3000');
    for (const f of fotosNuvem) { const loc=await DB.pegar('fotos',f.id); if(!loc) await DB.salvar('fotos',{...f,sync:'ok'}); }
    log('Baixado: '+nUs+' usuários, '+obrasNuvem.length+' obras, '+regsNuvem.length+' registros, '+fotosNuvem.length+' fotos.');
    log(erros?'Concluído com '+erros+' erro(s).':'Concluído sem erros.');
    let c=getCfg(); c.ultimaSync=new Date().toISOString(); setCfg(c);
    if(!silencioso) aviso(erros?'Sincronizado com '+erros+' erro(s)':'Sincronizado com sucesso!');
  }catch(e){ log('✗ Falha geral: '+e.message); if(!silencioso) aviso('Erro ao sincronizar: '+e.message,4000); }
  finally{ sincronizando=false; await contarPendentes(); if(estado.tela==='sync') renderSync(true); if(estado.tela==='obras') renderObras(); if(estado.tela==='login') renderLogin(); }
}

// Checklist que o montador faz ANTES de começar a obra (fica gravado na própria obra, campo checklist_inicio)
const CHECK_INICIO = [
  ['pecas',      'Lista de peças do projeto conferida com o material entregue'],
  ['separacao',  'Material separado por categoria e por região/setor'],
  ['projeto',    'Projeto (mapa e planta) em mãos, setores e cavaletes identificados no campo'],
  ['deposito',   'Local de armazenamento do material definido e protegido'],
  ['maquina',    'Máquina de valeta combinada (quem fornece, quando chega)'],
  ['acesso',     'Acesso à obra, água e energia liberados pelo cliente'],
  ['equipe',     'Equipe Netasul e ajudantes do cliente definidos'],
  ['epi',        'EPIs e ferramentas conferidos'],
];
function checklistStatus(o){ const c=o.checklist_inicio||{}; const it=c.itens||{}; const feitos=CHECK_INICIO.filter(([k])=>it[k]).length; const cats=[...new Set((o.pecas||[]).map(p=>p.grupo||'SEM CATEGORIA'))]; const catsOk=(c.categorias||[]).filter(x=>cats.includes(x)).length; return {feitos, total:CHECK_INICIO.length, cats:cats.length, catsOk, concluido:!!c.concluido, c}; }
function htmlChecklist(o){
  const st=checklistStatus(o); const it=st.c.itens||{}; const cats=[...new Set((o.pecas||[]).map(p=>p.grupo||'SEM CATEGORIA'))].sort();

    ${cats.length?`<h3>Conferência das peças por categoria</h3><div class="ajuda">Marque cada categoria depois de conferir quantidade e estado do material contra a lista do projeto.</div><div class="chips">${cats.map(g=>`<label><input type="checkbox" class="ck-cat" value="${esc(g)}" ${(st.c.categorias||[]).includes(g)?'checked':''}>${esc(g)}</label>`).join('')}</div>`:'<div class="ajuda">Esta obra ainda não tem lista de peças importada pelo gerente.</div>'}
    <label>Faltou ou veio diferente do projeto? (peças, quantidades, avarias)</label><textarea id="ck-obs">${esc(st.c.obs||'')}</textarea>
    <div class="linha"><button class="botao secundario" onclick="salvarChecklist('${o.id}',false)">Salvar parcial</button><button class="botao" onclick="salvarChecklist('${o.id}',true)">✓ Concluir checklist</button></div></div>`;

let valoresTemp={}; let gruposSel=new Set();   // grupos (setores/casas) escolhidos na tela do dia   // valores digitados na árvore antes de salvar (para não perder ao marcar/desmarcar frentes)
function htmlArvore(prog, modo, frentesSel){ // modo 'ver' (obra) ou 'editar' (registro); frentesSel = só estas frentes, já abertas
  let html='';
  for (const f of prog.frentes) {
    if (frentesSel && !frentesSel.includes(f.id)) continue;
    const orient=(reg&&reg.dia&&reg.dia.orientando||[]).includes(f.id);
    const papel = modo==='editar' ? `<div class="papel"><span>Nessa frente você estava</span><button type="button" class="${orient?'':'ativo'}" onclick="setPapel('${f.id}',false)">Executando</button><button type="button" class="${orient?'ativo':''}" onclick="setPapel('${f.id}',true)">Orientando a equipe</button></div>` : '';
    html+=`<details class="frente" ${frentesSel?'open':''}><summary><span class="seta">▶</span>${esc(f.nome)}<span class="pct">${Math.round(f.pct)}%</span></summary><div class="corpo">${papel}`;
    const grupos=[...new Set(f.itens.map(i=>i.grupo).filter(Boolean))];
    const filtrarGrupos = modo==='editar' && frentesSel && grupos.length>1;
    if (filtrarGrupos) html+=`<div class="mini" style="margin-top:4px">Em qual?</div><div class="chips" style="margin-bottom:6px">${grupos.map(g=>`<label><input type="checkbox" class="r-grupo" onchange="toggleGrupo('${f.id}|${esc(g)}',this.checked)" ${gruposSel.has(f.id+'|'+g)?'checked':''}>${esc(g)}</label>`).join('')}</div>`;
    let grupo=null;
    for (const i of f.itens) {
      if (filtrarGrupos && !gruposSel.has(f.id+'|'+i.grupo)) continue;
      if (i.grupo!==grupo) { grupo=i.grupo; if(grupo) html+=`<div class="grupo">${esc(grupo)}</div>`; }
      if (modo==='ver') {
        html+= i.tipo==='qtd' ? `<div class="it"><div class="nome">${esc(i.nome)}<small>${fmt(i.executado)} / ${fmt(i.previsto)} ${i.unidade} · ${Math.round(i.pct)}%</small></div><div style="width:90px"><div class="barra"><div style="width:${i.pct}%"></div></div></div></div>`
          : `<div class="it ${i.feito?'feito':''}"><div class="nome">${i.feito?'✅':'⬜'} ${esc(i.nome)}${i.feito?`<small>feito em ${dataBR(i.quando)}</small>`:''}</div></div>`;
      } else {
        const salvoHoje=reg.avancos.find(a=>a.item_id===i.id); let hoje_=salvoHoje; if (i.id in valoresTemp) hoje_ = valoresTemp[i.id]>0 ? {quantidade:valoresTemp[i.id]} : null; const jaFeitoAntes=i.feito && !(hoje_) && !(i.id in valoresTemp); 
        if (i.tipo==='qtd') html+=`<div class="it"><div class="nome">${esc(i.nome)}<small>acumulado ${fmt(i.executado - num(salvoHoje?.quantidade))} de ${fmt(i.previsto)} ${i.unidade}</small></div><input type="number" inputmode="decimal" placeholder="hoje" data-item="${i.id}" value="${hoje_?hoje_.quantidade:''}"><span class="mini">${i.unidade}</span></div>`;
        else html+=`<div class="it ${i.feito?'feito':''}"><input type="checkbox" data-item="${i.id}" ${(hoje_||i.feito)?'checked':''} ${jaFeitoAntes?'disabled':''}><div class="nome">${esc(i.nome)}${jaFeitoAntes?`<small>já concluído em ${dataBR(i.quando)}</small>`:''}</div></div>`;
      }
    }
    html+=`</div></details>`;
  }
  return html;
}

  }

function pegarGPS(){

    ()=>{ const t=$('gps-txt'); if(t) t.textContent='📍 GPS indisponível'; }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}
function minutos(h){ if(!h||!/^\d{2}:\d{2}$/.test(h)) return null; const [a,b]=h.split(':').map(Number); return a*60+b; }
// horas trabalhadas no dia = (fim - início) - (volta almoço - saída almoço)
function horasDia(d){ const i=minutos(d.hora_inicio), f=minutos(d.hora_fim); if(i===null||f===null||f<=i) return 0; let t=f-i; const as=minutos(d.hora_almoco_saida), av=minutos(d.hora_almoco_volta); if(as!==null&&av!==null&&av>as) t-=(av-as); return Math.round(t/60*100)/100; }
function horasTexto(d){ const h=horasDia(d); return h? 'Jornada de '+fmt(h)+' h trabalhadas' : 'Informe início e fim para calcular as horas.'; }
function atualizarHoras(){ const d={hora_inicio:$('h-ini').value,hora_almoco_saida:$('h-as').value,hora_almoco_volta:$('h-av').value,hora_fim:$('h-fim').value}; $('h-total').textContent=horasTexto(d); }

function addMaquina(){ const m=$('q-maq').value.trim(), h=num($('q-horas').value); if(!m||!h) return aviso('Informe a máquina e as horas.'); reg.maquinas.push({origem:$('q-origem').value, maquina:m, horas:h, obs:$('q-obs').value.trim()}); $('q-maq').value=''; $('q-horas').value=''; $('q-obs').value=''; renderListasReg(); }

function reduzirFoto(arquivo){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(arquivo);
  img.onload=()=>{ const max=1280; let w=img.width,h=img.height; if(w>h&&w>max){h=h*max/w;w=max;} else if(h>max){w=w*max/h;h=max;} const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>{ URL.revokeObjectURL(url); b?res(b):rej(new Error('falha ao converter foto')); },'image/jpeg',0.72); };
  img.onerror=()=>rej(new Error('não foi possível abrir a imagem')); img.src=url; }); }

  const frentesSel=[...document.querySelectorAll('.r-frente:checked')].map(e=>e.value);
  reg.dia={ frentes:frentesSel, orientando:(reg.dia.orientando||[]).filter(f=>frentesSel.includes(f)), resumo:'',
    hora_inicio:$('h-ini').value, hora_almoco_saida:$('h-as').value, hora_almoco_volta:$('h-av').value, hora_fim:$('h-fim').value,
    equipe_netasul:num($('r-eqn').value), ajudantes_cliente:num($('r-ajc').value) };
  reg.dia.horas=horasDia(reg.dia);
  // gera automaticamente as linhas de mão de obra a partir das pessoas e dos horários (as linhas "auto" são refeitas a cada salvamento)
  reg.mao_obra=(reg.mao_obra||[]).filter(m=>!m.auto);
  if (reg.dia.equipe_netasul>0) reg.mao_obra.unshift({origem:'netasul', funcao:'Montador', pessoas:reg.dia.equipe_netasul, horas:reg.dia.horas, auto:true});
  if (reg.dia.ajudantes_cliente>0) reg.mao_obra.unshift({origem:'contratante', funcao:'Ajudante', pessoas:reg.dia.ajudantes_cliente, horas:reg.dia.horas, auto:true});
  // lê a árvore: quantidades de hoje e itens ✓ marcados hoje (os já concluídos antes ficam desabilitados e não entram)
  reg.avancos=[];
  for (const el of document.querySelectorAll('#itens-frentes [data-item]')) {
    if (el.type==='checkbox') { if (el.checked && !el.disabled) reg.avancos.push({item_id:el.dataset.item, quantidade:1}); }
    else { const q=num(el.value); if (q>0) reg.avancos.push({item_id:el.dataset.item, quantidade:q}); }
  }
  reg.sync='pendente'; delete reg.erro;
  await DB.salvar('registros',reg);
  for (const f of fotosReg) { if (fotosRemover.includes(f.id)) { if(f.sync==='ok'){ f.sync='apagar'; await DB.salvar('fotos',f);} else await DB.apagar('fotos',f.id); } else await DB.salvar('fotos',f); }
  await contarPendentes(); aviso('Registro salvo no celular.');
  estado.historico=[]; mostrar('obra',{obraId:reg.obra_id},false); sincronizar(true);
}
async function apagarRegistro(){
  if(!confirm('Apagar este registro diário?')) return;
  if (reg.sync==='ok') { reg.sync='apagar'; await DB.salvar('registros',reg); } else await DB.apagar('registros',reg.id);
  for (const f of fotosReg) { if(f.sync==='ok'){ f.sync='apagar'; await DB.salvar('fotos',f);} else await DB.apagar('fotos',f.id); }
  await contarPendentes(); estado.historico=[]; mostrar('obra',{obraId:reg.obra_id},false); sincronizar(true);
}

/* ---------- 5.5 Sincronizar ---------- */
async function renderSync(manterLog=false){
  $('titulo').textContent='Sincronizar';
  const logAntigo = manterLog && $('log-sync') ? $('log-sync').textContent : '';
  const pend=await contarPendentes(); const c=getCfg();
  const comErro=[...(await DB.todos('registros')),...(await DB.todos('fotos'))].filter(x=>x.erro);
  $('tela').innerHTML=`<div class="cartao"><h2>Situação</h2>
    <div class="kpis"><div class="kpi"><div class="v">${pend}</div><div class="t">itens aguardando envio</div></div><div class="kpi"><div class="v" style="font-size:14px">${c.ultimaSync?new Date(c.ultimaSync).toLocaleString('pt-BR'):'nunca'}</div><div class="t">última sincronização</div></div></div>
    <div class="ajuda">O app sincroniza sozinho ao salvar um registro com internet. Use o botão para forçar o envio ou para baixar obras novas cadastradas pelo gerente.</div>
    <button class="botao azul" id="btn-sync" onclick="sincronizar()" ${cfgOk()?'':'disabled'}>☁️ Sincronizar agora</button>
    ${cfgOk()?'':'<div class="ajuda" style="color:var(--vermelho)">Servidor não configurado. Vá em Configurar.</div>'}
    ${comErro.length?`<h3>Itens com erro (${comErro.length})</h3>${comErro.map(x=>`<div class="mini" style="color:var(--vermelho);margin-top:4px">• ${esc(dataBR(x.data)||x.legenda||'foto')}: ${esc(x.erro)}</div>`).join('')}`:''}
    <div class="log" id="log-sync">${esc(logAntigo)}</div></div>`;
}

/* ---------- 5.6 Configurar ---------- */
function renderConfig(){
  $('titulo').textContent='Configurar'; const c=getCfg();
  $('tela').innerHTML=`<div class="cartao"><h2>Servidor (Supabase)</h2>
    <div class="ajuda">Copie do painel do Supabase em <b>Project Settings → API</b>. O gerente pode te passar os dois valores.</div>
    <label>Project URL</label><input id="c-url" value="${esc(c.url||'')}" placeholder="https://xxxxxxxx.supabase.co" inputmode="url" autocapitalize="off">
    <label>Chave anon (public)</label><textarea id="c-key" style="min-height:90px;font-size:13px" autocapitalize="off">${esc(c.key||'')}</textarea>
    <button class="botao" onclick="salvarConfig()">💾 Salvar configuração</button>
    <button class="botao secundario" onclick="testarConexao()">🔌 Testar conexão</button>
    <div id="c-result" class="ajuda"></div></div>
  <div class="cartao"><h2>Sobre</h2><div class="mini">Netasul Obras · aparelho ${dispositivoId()} · versão ${VERSAO}${c.usuario?' · usuário '+esc(c.usuario.nome):''}</div>
    ${c.usuario?'<button class="botao secundario" onclick="sair()">Sair do usuário</button>':'<button class="botao secundario" onclick="mostrar(\'login\')">Ir para o login</button>'}
    <button class="botao perigo" onclick="limparTudo()">Apagar dados locais já enviados</button></div>`;
}
function salvarConfig(){ const c=getCfg(); c.url=$('c-url').value.trim().replace(/\/+$/,''); c.key=$('c-key').value.trim(); setCfg(c); aviso('Configuração salva.'); }
async function testarConexao(){
  salvarConfig(); const r=$('c-result'); r.textContent='Testando…';
  try{ const n=await baixarUsuarios(); r.innerHTML='<span style="color:var(--verde-escuro)">✓ Conectado! '+n+' usuário(s) baixado(s). Agora vá para o login.</span>'; }
  catch(e){ r.innerHTML='<span style="color:var(--vermelho)">✗ Falhou: '+esc(e.message)+'</span>'; }
}
async function limparTudo(){
  if(!confirm('Remove do celular apenas os itens já enviados (para liberar espaço). Os pendentes ficam. Continuar?')) return;
  for (const n of ['fotos','registros']) for (const x of await DB.todos(n)) if (x.sync==='ok') await DB.apagar(n,x.id);
  aviso('Espaço liberado. Sincronize para baixar de novo o que precisar.');
}

/* ------------------------------ 6. INICIALIZAÇÃO ------------------------------ */
function atualizarRede(){ const s=$('status-rede'); s.textContent=navigator.onLine?'online':'offline'; s.classList.toggle('offline',!navigator.onLine); }
window.addEventListener('online', ()=>{ atualizarRede(); sincronizar(true); });
window.addEventListener('offline', atualizarRede);
(async function iniciar(){
  atualizarRede(); await DB.abrir();
  // Se o app foi publicado pelo painel, ele já vem com o endereço da nuvem: configura sozinho na primeira abertura
  if (window.NETASUL_CFG && window.NETASUL_CFG.url) { const c=getCfg(); if (!c.url || !c.key) { c.url=window.NETASUL_CFG.url; c.key=window.NETASUL_CFG.key; setCfg(c); } }
  if (cfgOk() && navigator.onLine && !(await DB.todos('usuarios')).length) { try{ await baixarUsuarios(); }catch(e){} }
  await contarPendentes();
  mostrar(usuarioAtual()?'obras':'login',{},false);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (navigator.onLine && cfgOk()) sincronizar(true);
})();
</script>
